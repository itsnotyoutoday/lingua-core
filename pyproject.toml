[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lingua-core"
version = "0.1.0"
description = "Pipeline engine and pod control for the lingua backend"
requires-python = ">=3.10"
# Deliberately thin. This is imported both on a laptop and inside every image, so anything
# heavy here becomes cold-start latency on a GPU pod. Stage implementations bring their own
# dependencies; the engine brings almost none.
dependencies = [
    "requests>=2.31",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
runctl = "runctl:main"

[tool.setuptools]
packages = ["lingua_core"]
py-modules = ["runctl"]
